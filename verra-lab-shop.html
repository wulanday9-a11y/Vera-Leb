*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
h1,h2,h3,h4{margin:0;line-height:1.25}
em{font-style:normal}
.w{max-width:1100px;margin:0 auto;padding:0 20px}

.ann{background:var(--brand);color:#fff;font-size:13px;text-align:center;padding:7px 12px}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:22px;height:58px}
.logo{font-weight:700;font-size:20px;color:var(--brand);margin-right:auto;letter-spacing:-.2px}
.menu{display:flex;gap:20px;font-size:14px}
.menu a{color:var(--ink);padding:4px 0;border-bottom:2px solid transparent}
.menu a:hover{border-color:var(--brand)}
.lang{display:flex;font-size:12px}
.lang button{border:1px solid var(--line);background:#fff;color:var(--mute);padding:4px 9px;cursor:pointer;font:inherit}
.lang button:first-child{border-radius:4px 0 0 4px}
.lang button:last-child{border-radius:0 4px 4px 0;border-left:0}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{display:inline-block;border:0;background:var(--brand);color:#fff;font:inherit;font-size:14px;font-weight:600;padding:9px 18px;border-radius:4px;cursor:pointer;text-align:center}
.btn:hover{background:var(--brand2)}
.btn.line{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.line:hover{background:var(--soft)}
.btn.sm{padding:7px 12px;font-size:13px}

.hero{margin:22px 0 0;background:var(--soft);border-radius:6px;display:grid;grid-template-columns:1fr 280px;gap:30px;align-items:center;padding:30px 34px}
.hero h1{font-size:clamp(24px,3.4vw,34px);font-weight:700;margin-bottom:10px}
.hero p{color:var(--mute);margin:0 0 18px;max-width:34em}
.hero img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0 0;font-size:13px}
.trust div{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;gap:8px;align-items:center}
.trust b{color:var(--brand);font-size:16px}

section{padding:38px 0 0}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.sh h2{font-size:22px}
.sh p{margin:0;color:var(--mute);font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:13px;padding:6px 14px;border-radius:4px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{border:1px solid var(--line);border-radius:6px;padding:10px;cursor:pointer;display:flex;flex-direction:column;background:#fff}
.card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.card .ph{aspect-ratio:1/1;width:100%;object-fit:cover;border-radius:4px;background:var(--soft);margin-bottom:10px}
.card small{color:var(--mute);font-size:12px}
.card h3{font-size:15px;font-weight:600;margin:2px 0 1px}
.card .sp{color:var(--mute);font-size:13px;margin:0}
.card .pu{font-size:12px;color:var(--brand);margin:6px 0 0}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px}
.card .price{font-size:17px;font-weight:700}
.notice{color:var(--mute);font-size:12.5px;margin:18px 0 0;border-left:3px solid var(--line);padding-left:12px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.blk{border:1px solid var(--line);border-radius:6px;padding:20px 22px}
.blk h3{font-size:17px;margin-bottom:4px}
.blk p{margin:0 0 10px;color:var(--mute);font-size:14px}
.blk ul{margin:0;padding-left:18px;font-size:14px}
.blk li{padding:2px 0}
table.cmp{width:100%;border-collapse:collapse;font-size:14px;border:1px solid var(--line)}
.cmp th,.cmp td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
.cmp th{background:var(--soft);font-weight:600}
.cmp td:last-child,.cmp th:last-child{background:#f1f7f4}
details{border-bottom:1px solid var(--line);padding:12px 0}
details:first-of-type{border-top:1px solid var(--line)}
summary{cursor:pointer;font-weight:600;font-size:15px}
details p{margin:8px 0 0;color:var(--mute);font-size:14px;max-width:46em}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:20px;border:1px solid var(--line);border-radius:6px;padding:24px;font-size:14px}
.contact h2{font-size:20px;margin-bottom:12px}

footer{margin-top:50px;background:var(--soft);border-top:1px solid var(--line);padding:30px 0 24px;font-size:13px;color:var(--mute)}
.fc{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:24px}
footer b{display:block;color:var(--ink);margin-bottom:6px}
footer a{display:block;padding:2px 0}footer a:hover{color:var(--brand)}

.layer{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:none}.layer.on{display:block}
.panel{position:absolute;top:0;right:0;bottom:0;width:min(380px,100%);background:#fff;padding:18px 20px;display:flex;flex-direction:column;overflow-y:auto}
.x{align-self:flex-end;background:none;border:0;color:var(--ink);font-size:26px;cursor:pointer;line-height:1}
.panel h2{font-size:20px;margin:0 0 8px}
.line{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.thumb{width:48px;height:48px;border-radius:4px;object-fit:cover;background:var(--soft);flex-shrink:0}
.qty{display:inline-flex;align-items:center;gap:8px;margin-top:4px}
.qty button{width:22px;height:22px;border-radius:3px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;line-height:1}
.panel .ph{width:100%;max-width:220px;aspect-ratio:1/1;object-fit:cover;border-radius:4px;background:var(--soft);margin:6px auto 12px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin:12px 0}
.tbl td{padding:7px 0;border-bottom:1px solid var(--line)}.tbl td:first-child{color:var(--mute);width:38%}
.tag{display:inline-block;font-size:12px;color:var(--brand);border:1px solid var(--line);border-radius:3px;padding:1px 8px;margin-bottom:6px}

@media(max-width:860px){.menu{display:none}.grid{grid-template-columns:repeat(3,1fr)}.trust{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr;padding:22px}.hero img{max-width:260px}.two,.contact,.fc{grid-template-columns:1fr}}

function tabs(){$("tabs").innerHTML=["all","single","blend","supplies"].map(function(c){return '<button class="tab" aria-pressed="'+(c===cat)+'" data-cat="'+c+'">'+t(c)+'</button>'}).join("")}
function grid(){$("grid").innerHTML=P.filter(function(x){return cat==="all"||x.c===cat}).map(function(x){
return '<div class="card" data-open="'+x.id+'">'+photo(x,480)+'<small>'+t(x.c)+'</small><h3>'+x.n+'</h3><p class="sp">'+sp(x)+'</p>'+(x.w?'':'<p class="pu">'+t("purl")+'</p>')+'<div class="row"><span class="price">'+rp(x.p)+'</span><button class="btn sm" data-add="'+x.id+'">'+t("add")+'</button></div></div>'}).join("")}
function render(){var ids=Object.keys(cart).filter(function(k){return cart[k]>0}),tot=0,n=0;
$("lines").innerHTML=ids.length?ids.map(function(k){var x=find(k);tot+=x.p*cart[k];n+=cart[k];
return '<div class="line">'+photo(x,96,"thumb")+'<div style="flex:1"><b>'+x.n+'</b><br><small style="color:var(--mute)">'+sp(x)+'</small><div class="qty"><button data-dec="'+k+'">−</button>'+cart[k]+'<button data-add="'+k+'">+</button></div></div><b>'+rp(x.p*cart[k])+'</b></div>'}).join(""):'<p style="color:var(--mute)">'+t("empty")+'</p>';
$("count").textContent=n;$("sub").textContent=rp(tot);
var a=$("checkout");if(ids.length){var m=encodeURIComponent(t("msg")+"\n"+ids.map(function(k){var x=find(k);return "- "+x.n+" "+x.mg+" x"+cart[k]}).join("\n")+"\nSubtotal: "+rp(tot));a.href="https://wa.me/"+WA+"?text="+m;a.style.opacity=1}else{a.removeAttribute("href");a.style.opacity=.4}
save()}
function detail(id){var x=find(id),rows;
if(x.w===1)rows=[[t("comp"),t("bw")],["Volume","30 mL"],[t("stor"),L==="nl"?"Kamertemperatuur":"Room temperature"]];
else if(x.w===2)rows=[[L==="nl"?"Inhoud":"Contents",t("kitc")]];
else rows=[[t("comp"),x.k],[t("pur"),x.b?t("purb"):t("purv")],[t("form"),t("formv")],[t("stor"),t("storv")],[t("pack"),t("packv")(x.v)]];
$("prodPanel").innerHTML='<button class="x" data-close aria-label="Close">×</button>'+photo(x,480)+'<span class="tag" style="align-self:flex-start">'+t(x.c)+'</span><h2>'+x.n+'</h2><p style="color:var(--mute);margin:2px 0 0">'+sp(x)+'</p><table class="tbl">'+rows.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>'}).join("")+'</table><p style="font-size:12.5px;color:var(--mute)">'+t("lab")+'</p><div class="line" style="border:0;margin-top:auto"><b style="font-size:20px">'+rp(x.p)+'</b><button class="btn" data-add="'+x.id+'" data-close>'+t("addc")+'</button></div>';$("prodLayer").classList.add("on")}
function all(){statics();tabs();grid();render()}
document.addEventListener("click",function(e){var q=e.target,b;
if(b=q.closest("[data-lang]")){L=b.dataset.lang;try{localStorage.setItem("vl-lang",L)}catch(x){}all();return}
if(b=q.closest("[data-add]")){e.stopPropagation();e.preventDefault();var k=b.dataset.add;cart[k]=(cart[k]||0)+1;render();if(b.hasAttribute("data-close"))$("prodLayer").classList.remove("on");return}
if(b=q.closest("[data-dec]")){cart[b.dataset.dec]--;render();return}
if(b=q.closest("[data-cat]")){cat=b.dataset.cat;tabs();grid();return}
if(q.closest("[data-close]")||q.classList.contains("layer")){document.querySelectorAll(".layer").forEach(function(l){l.classList.remove("on")});return}
if(q.closest("#openCart")){$("cartLayer").classList.add("on");return}
if(b=q.closest("[data-go]")){cat=b.dataset.go;tabs();grid();return}
if(b=q.closest("[data-open]")){e.preventDefault();detail(b.dataset.open)}});
all();
</script>
</body>
</html>
